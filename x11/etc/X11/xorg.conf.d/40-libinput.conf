Section "InputClass"
    Identifier "all pointers"
    MatchIsPointer "on"
    Driver "libinput"
    Option "NaturalScrolling" "false"
EndSection

Section "InputClass"
    Identifier "elan touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "NaturalScrolling" "false"
    Option "ScrollMethod" "twofinger"
    Option "TappingButtonMap" "lrm"
    Option "Tapping" "on"
EndSection
